# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

use_default_settings: true

search:
  formats:
    - html
    - json

server:
  secret_key: "$(openssl rand -base64 30 | tr -d '/' | tr -d '+')"
  image_proxy: true

engines:
  - name: wikidata
    engine: wikidata
    shortcut: wd
    inactive: true
  - name: ahmia
    inactive: true
  - name: torch
    inactive: true
