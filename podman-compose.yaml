name: jarvis

services:
  llama-dgpu:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    restart: unless-stopped
    ports:
      - "9931:9931"
    volumes:
      - ${HOME}/models:/models:Z
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    command: [ "--port", "9931", "--device", "Vulkan0", "--models-dir", "/models", "--models-preset", "/models/models-preset.ini", "--models-max", "1" ]
    # command: [ "--port", "9931", "--model", "/models/qwen3.8-27b/Qwen3.8-27B-UD-IQ4_XS.gguf", "--ctx-size", "65535", "--jinja", "--cache-type-k", "q4_0", "--cache-type-v", "q4_0", "--flash-attn", "on", "--n-gpu-layers", "-1", "--threads", "8", "--device", "Vulkan0" ]
    cpuset: "0-7,16-23" # AMD Ryzen 9 7950X3D, CCD0 has the 3D V-cache
    environment:
      GGML_VK_VISIBLE_DEVICES: ${GGML_VK_VISIBLE_DEVICES:-1} # "System has iGPU at idx 0, force llama.cpp to only use dGPU)
      LLAMA_ARG_ENDPOINT_METRICS: "1"
      LLAMA_ARG_ENDPOINT_SLOTS: "1"

#  llama-cpu:
#    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
#    restart: unless-stopped
#    ports:
#      - "9932:9932"
#    volumes:
#      - ${HOME}/models:/models:Z
#    devices:
#      - "/dev/kfd"
#      - "/dev/dri"
#    command: [ "--port", "9932", "--model", "/models/qwen3.5-4b/Qwen3.5-4B-UD-IQ2_M.gguf", "--ctx-size", "8192", "-b", "512", "-ub", "512",  "--jinja", "--cache-type-k", "q4_0", "--cache-type-v", "q4_0", "--flash-attn", "on", "--threads", "8", "-ngl", "0", "--reasoning", "off" ]
#    cpuset: "0-7,16-23" # AMD Ryzen 9 7950X3D, CCD0 has the 3D V-cache
#    environment:
#      LLAMA_ARG_ENDPOINT_METRICS: "1"
#      LLAMA_ARG_ENDPOINT_SLOTS: "1"

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    ports:
      - "${OPEN_WEBUI_APP_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - llama-dgpu
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me}
      WEBUI_NAME: Open WebUI
      CONTEXT_COMPACTION_TOKEN_THRESHOLD: 30720
      ENABLE_CONTEXT_COMPACTION: "true"
      ENABLE_OPENAI_API: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      WEB_SEARCH_RESULT_COUNT: 3
      WEB_SEARCH_CONCURRENT_REQUESTS: 10
      SEARXNG_QUERY_URL: ${SEARXNG_QUERY_URL:-http://host.docker.internal:8089/search?q=<query>}
      DOCLING_PARAMS: "{\"do_ocr\": true, \"force_ocr\": false, \"pdf_backend\": \"pypdfium2\", \"ocr_engine\": \"tesseract\", \"ocr_lang\": \"eng\", \"table_mode\": \"accurate\"}"
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - open-terminal:/home/user
    depends-on: open-webui
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:-change-me}

  docling-serve:
    image: quay.io/docling-project/docling-serve:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # Enable the web UI for testing
      DOCLING_SERVE_ENABLE_UI: false
      # CRITICAL: Required for picture description with external LLM APIs
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: true
      DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG: true
      # Maximum wait time for sync requests (seconds) - increase for large documents
      DOCLING_SERVE_MAX_SYNC_WAIT: 600
      # Number of local engine workers
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: 2
      # CPU thread configuration
      DOCLING_NUM_THREADS: 8
      OMP_NUM_THREADS: 8
      MKL_NUM_THREADS: 8
      # IMPORTANT: Keep at 1 to avoid "Task Not Found" errors
      UVICORN_WORKERS: 1
      DOCLING_API_KEY: ${DOCLING_API_KEY:-change-me}
    # For GPU support with NVIDIA:
    # deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]

  searxng-core:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    volumes:
      - ./searxng-core-config:/etc/searxng:Z
      - searxng-core-data:/var/cache/searxng/
    depends_on:
      - open-webui
    environment:
      SEARXNG_VERSION: ${SEARXNG_VERSION:-latest}
      SEARXNG_HOST: ${SEARXNG_HOST:-[::]}
      SEARXNG_PORT: ${SEARXNG_PORT:-8089}

  searxng-valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - searxng-valkey-data:/data/
    depends_on:
      - open-webui

volumes:
  open-terminal:
  open-webui:
  searxng-core-data:
  searxng-valkey-data:
